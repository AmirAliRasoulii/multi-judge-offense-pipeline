[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-judge-offense-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]
description = "Multi-judge LLM pipeline for offensive content classification, consensus aggregation, and HITL review"

[project.scripts]
offense-judge = "offense_judge.cli:main"
avalai-offense = "offense_judge.cli:main"

[tool.setuptools.packages.find]
include = ["offense_judge*"]
